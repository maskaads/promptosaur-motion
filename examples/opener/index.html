<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Promptosaur opener example</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0C0916; }
  #stage { position: absolute; inset: 0; transform-origin: 50% 50%;
    background-image: linear-gradient(#211a36 1px, transparent 1px), linear-gradient(90deg, #211a36 1px, transparent 1px);
    background-size: 64px 64px; background-position: -1px -1px; }
  #glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(124,77,255,.22), rgba(12,9,22,0) 60%); }
  .abs { position: absolute; left: 50%; top: 50%; will-change: transform, opacity; }
  #bar { width: 900px; height: 120px; margin: -60px 0 0 -450px; border-radius: 22px; background: #1E1736;
    border: 2px solid #4A3B80; box-shadow: 0 0 60px rgba(124,77,255,.35); display: flex; align-items: center; padding: 0 44px; box-sizing: border-box;
    font: 500 52px 'JetBrains Mono', Consolas, Menlo, monospace; color: #F4F1EA; }
  #bar .gt { color: #FFD23F; margin-right: 26px; }
  #caret { display: inline-block; width: 26px; height: 58px; background: #FFD23F; margin-left: 8px; }
  #circle { width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; background: #7C4DFF; }
  #square { width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 26px; background: #FFD23F; }
  #triangle { width: 0; height: 0; margin: -95px 0 0 -105px; border-left: 105px solid transparent; border-right: 105px solid transparent; border-bottom: 190px solid #F4F1EA; }
  #title { margin: -40px 0 0 0; font: 800 150px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: 4px; color: #F4F1EA; white-space: nowrap; }
  #tagline { margin: 150px 0 0 0; font: 500 40px 'JetBrains Mono', Consolas, Menlo, monospace; color: #A78BFA; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="bar" class="abs" data-solid><span class="gt">&gt;</span><span id="typed" data-text data-on="bar"></span><span id="caret"></span></div>
  <div id="circle" class="abs" data-solid></div>
  <div id="square" class="abs" data-solid></div>
  <div id="triangle" class="abs" data-solid></div>
  <div id="title" class="abs" data-text>PROMPTOSAUR</div>
  <div id="tagline" class="abs" data-text>made by AI</div>
</div>
<script>
// Every move comes from timeline.json, the same file check_timeline.py reads.
const ease = {
  'expo.out': p => p === 1 ? 1 : 1 - Math.pow(2, -10 * p),
  'expo.in': p => p === 0 ? 0 : Math.pow(2, 10 * p - 10),
  'expo.inOut': p => p === 0 || p === 1 ? p : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  'back.out': p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  'linear': p => p,
  'steps': p => p,
};
let TL = null;
const $ = id => document.getElementById(id);

function progress(id, f) {
  const e = TL.events.find(x => x.id === id);
  const p = (f - e.start) / (e.end - e.start);
  if (p <= 0) return 0;  // exact 0 and 1 outside the event: back.out(0) is -4e-16, not 0
  if (p >= 1) return 1;
  return ease[e.ease](p);
}

window.renderFrame = async (f, fps) => {
  if (!TL) TL = await (await fetch('timeline.json')).json();
  window.DURATION = TL.duration;
  const lerp = (a, b, p) => a + (b - a) * p;

  // camera: slow constant push
  $('stage').style.transform = `scale(${1 + 0.035 * progress('drift', f)})`;

  // prompt bar in, typing, bar out
  const bi = progress('bar-in', f), bo = progress('bar-out', f);
  $('bar').style.opacity = (0.45 + 0.55 * bi) * (1 - bo);  // frame 0 already shows the bar: it is the thumbnail
  $('bar').style.transform = `translateY(${lerp(60, 0, bi)}px) scale(${lerp(0.92, 1, bi) * lerp(1, 0.4, bo)})`;
  const text = TL.events.find(x => x.id === 'typing').text;
  $('typed').textContent = text.slice(0, Math.floor(progress('typing', f) * text.length));
  $('caret').style.opacity = f < 54 || Math.floor(f / 15) % 2 === 0 ? 1 : 0;  // steady while typing, then blinks

  // three shapes pop in, then gather into one mark above the title
  const g = progress('shapes-gather', f);
  const shapes = [['circle', 'circle-in', -330, 0, -70, -230], ['square', 'square-in', 0, 0, 0, -250], ['triangle', 'triangle-in', 330, 0, 70, -230]];
  for (const [el, ev, x0, y0, x1, y1] of shapes) {
    const p = progress(ev, f);
    $(el).style.opacity = Math.min(1, p * 1.5);
    $(el).style.transform = `translate(${lerp(x0, x1, g)}px, ${lerp(y0, y1, g)}px) scale(${p * lerp(1, 0.42, g)}) rotate(${lerp(-25, 0, p)}deg)`;
  }

  // title and tagline
  const t = progress('title-in', f), tg = progress('tagline-in', f);
  $('title').style.opacity = t;
  $('title').style.transform = `translate(-50%, ${lerp(70, 0, t)}px)`;
  $('title').style.letterSpacing = `${lerp(40, 4, t)}px`;
  $('tagline').style.opacity = tg;
  $('tagline').style.transform = `translate(-50%, ${lerp(40, 0, tg)}px)`;
};
</script>
</body>
</html>
